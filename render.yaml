services:
  - type: web
    name: stockview-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: CORS_ORIGINS
        value: https://stock-view-ebon.vercel.app
      - key: NEWS_API_KEY
        sync: false
    healthCheckPath: /
    plan: free

